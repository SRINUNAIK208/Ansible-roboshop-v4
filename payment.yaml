- name: configure payment server 
  hosts: payment 
  become: yes 
  tasks:
  - name: install python
    ansible.builtin.dnf:
      name: "{{ item }}"
      start: present 
    loop:
    - python3 
    - gcc 
    - python3-devel
  
  - name: create system user 
    ansible.builtin.user: 
      name: roboshop 
      shell: /sbin/nologin
      home: /app 
      system: yes 
      state: present 

  - name: create home direcory 
    ansible.builtin.file:
      path: /app 
      state: direcory 

  - name: download the payment code 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip 

  - name: unzip the payment code 
    ansible.builtin.unarchive:
      src: /tmp/payment.zip 
      dest: /app
      remote_src: yes 
  
  - name: install dependencies
    ansible.builtin.pip:
      requirements: requirements.txt
      executable: pip3.9 
    args:
      chdir: /app

  - name: setup systemd service 
    ansible.builtin.copy:
      src: payment.service 
      dest: /etc/systemd/system/payment.service 

  - name: daemon reload 
    ansible.builtin.systemd_service:
      daemon_reload: true 

  - name: start and enable payment service 
    ansible.builtin.service:
      name: payment
      state: started
      enabled: yes 

  
  
  