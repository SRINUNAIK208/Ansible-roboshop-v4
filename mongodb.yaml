- name: configure mongodb server 
  hosts: mongodb 
  become: yes 
  tasks:
  - name: set mongodb repo 
    ansible.builtin.copy:
      src: mongo.repo 
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb 
    ansible.builtin.dnf:
      name: mongodb-org 
      state: installed 

  - name: enable and start the mongodb server 
    ansible.builtin.service:
      name: mongod 
      state: started 
      enabled: yes 

  - name: set remote login using ip
    ansible.builtin.replace:
      path: /etc/mongod.conf 
      regexp: 127.0.0.1
      replace: 0.0.0.0 
      
  - name: restart the server 
    ansible.builtin.service:
      name: mongod 
      state: restarted 
