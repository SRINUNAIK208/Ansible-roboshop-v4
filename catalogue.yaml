- name: configure catalogue server 
  hosts: catalogue 
  become: yes 
  tasks:
  - name: disabled latest version and enabled old version of nodejs 
    ansible.builtin.command: dnf module disable nodejs -y
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs 
    ansible.builtin.dnf:
      name: nodejs
      state: installed 
  
  - name: create system user 
    ansible.builtin.user: 
      name: roboshop 
      shell: /sbin/nologin
      home: /app 
      system: yes 
      state: present 

  - name: create home direcory 
    ansible.builtin.file:
      path: /app 
      state: directory 

  - name: download the catalogue code 
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip 

  - name: unzip the catalogue code 
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip 
      dest: /app
      remote_src: yes 
  
  - name: install dependencies
    community.general.npm:
      path: /app 

  - name: setup systemd service 
    ansible.builtin.copy:
      src: catalogue.service 
      dest: /etc/systemd/system/catalogue.service 

  - name: daemon reload 
    ansible.builtin.systemd_service:
      daemon_reload: true 

  - name: start and enable catalogue service 
    ansible.builtin.service:
      name: catalogue
      state: started
      enabled: yes 

  - name: setup mongodb repo 
    ansible.builtin.copy:
      src: mongo.repo 
      dest: /etc/yum.repos.d/mongo.repo 
  
  - name: install mongodb client 
    ansible.builtin.dnf:
      name: mongodb-mongosh 
      state: present 

  - name: check the catalogue database 
    ansible.builtin.shell: mongosh --host mongodb.srinunayak.online --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output

  - name: print the catalogue_output
    ansible.builtin.debug:
      msg: "{{ catalogue_output }}"

  - name: load mongodb data 
    ansible.builtin.shell: mongosh --host mongodb.srinunayak.online </app/db/master-data.js
    when: catalogue_output.stdout | int > 0

  
  