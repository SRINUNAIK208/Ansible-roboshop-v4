- name: configure frontend server 
  hosts: frontend 
  become: yes 
  tasks:
  - name: disable latest version and enaled old version
    ansible.builtin.command: dnf module disable nginx -y
    ansible.builtin.command: dnf module enable nginx:1.24 -y 

  - name: install nginx 
    ansible.builtin.dnf:
      name: nginx 
      state: installed

  - name: start and enable nginx 
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes 

  - name: remove default content 
    ansible.builtin.file:
       path: /usr/share/nginx/html/*
       state: absent 

  - name: downloadthe frontend code 
    ansible.builtin.get_url:
      src: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
      dest: /tmp/frontend.zip 

  - name: create directory
    ansible.builtin.file:
       path: /usr/share/nginx/html 
       state: directory

  - name: unzip the frontend code 
    ansible.builtin.unarchive:
       src: /tmp/frontend.zip 
       dest: /usr/share/nginx/html 
       remote_src: yes 

  - name: remove default nginx conf
    ansible.builtin.file:
      path: /etc/nginx/nginx.conf
      state: absent

  - name: copy nginx cong file 
    ansible.builtin.copy:
      src: nginx.conf 
      dest: /etc/nginx/nginx.conf 

  - name: restart nginx server 
    ansible.builtin.service:
      name: nginx
      state: restarted